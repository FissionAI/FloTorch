version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: flotorch-postgres
    environment:
      POSTGRES_DB: flotorch
      POSTGRES_USER: flotorch
      POSTGRES_PASSWORD: flotorch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flotorch -d flotorch"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: flotorch-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - os_data:/usr/share/opensearch/data

volumes:
  pg_data:
  os_data:


